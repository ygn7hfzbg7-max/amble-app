<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amble</title>
    <meta name="description" content="Join someone's Saturday — find and join local hikes, walks, and food meetups, or host your own." />

    <!-- Generic app-level preview for links shared to WhatsApp, iMessage, etc.
         This app is client-rendered (Vite/React), so crawlers that don't run
         JS only ever see these static tags — a per-activity title/description
         in the preview would need server-side rendering or a prerender step. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amble" />
    <meta property="og:title" content="Amble" />
    <meta property="og:description" content="Join someone's Saturday — find and join local hikes, walks, and food meetups, or host your own." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
